name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Тесты (Python 3.12)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Системные пакеты (nmap, библиотеки для PDF)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nmap libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker:
    name: Сборка образа и запуск через install.sh
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Установка и запуск (как на ВМ)
        run: ./install.sh
        env:
          PS_ADMIN_PASSWORD: Ci-Test-Password-123
      - name: Приложение отвечает
        run: |
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS -o /dev/null -w "login: %{http_code}\n" http://127.0.0.1:8000/login
          curl -fsS -o /dev/null http://127.0.0.1:8000/static/css/app.css
      - name: Контейнер работает не от root, файловая система только для чтения
        run: |
          test "$(docker compose exec -T app id -u)" = "10001"
          if docker compose exec -T app sh -c 'touch /app/probe' 2>/dev/null; then echo "ФС доступна на запись"; exit 1; fi
          docker compose exec -T app sh -c 'touch /app/data/probe && rm /app/data/probe'
      - name: nmap с выданными capabilities (SYN, UDP, определение ОС)
        run: |
          docker compose exec -T app nmap --privileged -sS -sU -O -Pn -n -p T:8000,U:53 127.0.0.1 -oX - | tee /tmp/nmap.xml | tail -5
          grep -q 'portid="8000"><state state="open"' /tmp/nmap.xml
      - name: Запрещённые категории скриптов не попадают в профили
        run: |
          docker compose exec -T app python - <<'PY'
          import re, subprocess
          from app.scanner.nmap_profiles import PROFILES
          for key, prof in PROFILES.items():
              expr = prof.script_expression()
              if not expr:
                  continue
              out = subprocess.run(["nmap", "--script-help", expr], capture_output=True, text=True, check=True).stdout
              scripts = re.findall(r"^(\S+)\nCategories: (.*)$", out, re.M)
              bad = [n for n, c in scripts if {"brute", "dos", "exploit"} & set(c.split())]
              assert scripts and not bad, (key, bad)
              names = {n for n, _ in scripts}
              assert {"vulners", "ssl-enum-ciphers"} <= names, key
              print(key, len(scripts), "скриптов")
          PY
      - name: Экспорт PDF с кириллицей и резервная копия
        run: |
          docker compose exec -T app python -c "from weasyprint import HTML; d = HTML(string='<p>Проверка кириллицы</p>').write_pdf(); assert d[:4] == b'%PDF'; print(len(d), 'байт')"
          docker compose exec -T app python -m app.cli backup
      - name: Вход администратора и реальный быстрый скан
        run: |
          docker compose exec -T app python - <<'PY'
          import re, time, httpx
          # cookie помечены Secure, а проверка идёт по http — передаём их вручную
          def post(path, data, page):
              t = tok(page)
              cookies = "; ".join(f"{k}={v}" for k, v in jar.items())
              r = httpx.post("http://127.0.0.1:8000" + path, data={**data, "csrf_token": t}, headers={"Cookie": cookies})
              for h in r.headers.get_list("set-cookie"):
                  k, v = h.split(";")[0].split("=", 1); jar[k] = v
              return r
          jar = {}
          for h in httpx.get("http://127.0.0.1:8000/login").headers.get_list("set-cookie"):
              k, v = h.split(";")[0].split("=", 1); jar[k] = v
          def get(path):
              return httpx.get("http://127.0.0.1:8000" + path, headers={"Cookie": "; ".join(f"{k}={v}" for k, v in jar.items())})
          tok = lambda p: re.search(r'name="csrf_token" value="([^"]+)"', get(p).text).group(1)
          r = post("/login", {"username": "admin", "password": "Ci-Test-Password-123"}, "/login")
          assert r.status_code == 303, r.status_code
          import socket
          ip = socket.gethostbyname(socket.gethostname())
          r = post("/scans", {"new_targets": ip, "profile": "quick", "timing": "4"}, "/scans/new")
          assert r.status_code == 303, (r.status_code, r.text[:300])
          url = r.headers["location"]
          for _ in range(180):
              page = get(url + "/progress").text
              status = re.search(r"status-(\w+)", page).group(1)
              if status not in ("queued", "running"):
                  break
              time.sleep(2)
          print("скан:", status)
          assert status == "done", page
          detail = get(url).text
          assert "8000/tcp" in detail, "порт приложения не найден сканом"
          assert get("/reports/perimeter.pdf").content[:4] == b"%PDF"
          print("ok")
          PY
      - name: Журнал приложения
        if: always()
        run: docker compose logs --no-color app | tail -80
