{% from "partials/icons.html" import icon %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · {{ app_name }}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/app.js" defer></script>
</head>
<body class="flex min-h-screen items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="mb-6 flex flex-col items-center text-center">
      <span class="flex h-12 w-12 items-center justify-center rounded-xl bg-indigo-600 text-white shadow-lg shadow-indigo-600/20">{{ icon('shield', 'h-7 w-7') }}</span>
      <h1 class="mt-4">{{ app_name }}</h1>
      <p class="mt-1 text-sm muted">Контроль внешнего периметра</p>
    </div>
    <form method="post" action="/login" class="card card-body space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
      <input type="hidden" name="next" value="{{ next }}">
      {% if error %}<div class="alert-error" role="alert">{{ error }}</div>{% endif %}
      <div>
        <label class="label" for="username">Логин</label>
        <input class="input" id="username" name="username" value="{{ username or '' }}" autocomplete="username" required autofocus maxlength="64">
      </div>
      <div>
        <label class="label" for="password">Пароль</label>
        <input class="input" id="password" type="password" name="password" autocomplete="current-password" required maxlength="256">
      </div>
      <button class="btn-primary w-full">{{ icon('lock', 'h-4 w-4') }} Войти</button>
    </form>
    <div class="mt-4 flex justify-center">
      <button type="button" data-theme-toggle class="btn-ghost btn-sm">
        <span class="dark:hidden">{{ icon('moon', 'h-4 w-4') }} Тёмная тема</span><span class="hidden dark:inline-flex dark:items-center dark:gap-1.5">{{ icon('sun', 'h-4 w-4') }} Светлая тема</span>
      </button>
    </div>
  </div>
</body>
</html>
