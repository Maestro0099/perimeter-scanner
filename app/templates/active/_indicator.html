{% if active %}
{% set running = active|selectattr('status', 'equalto', 'running')|list %}
<a href="/active/{{ (running[0] if running else active[0]).id }}" class="hidden items-center gap-2 rounded-md bg-rose-50 px-3 py-1 font-mono text-xs font-semibold text-rose-700 ring-1 ring-inset ring-rose-200 hover:bg-rose-100 dark:bg-rose-500/10 dark:text-rose-300 dark:ring-rose-500/30 sm:inline-flex" title="Идёт активная проверка">
  <span class="relative flex h-2 w-2"><span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-rose-400 opacity-75"></span><span class="relative inline-flex h-2 w-2 rounded-full bg-rose-500"></span></span>
  Активная проверка{% if running %}: {{ running[0].progress|round|int }}%{% endif %}
</a>
{% endif %}
