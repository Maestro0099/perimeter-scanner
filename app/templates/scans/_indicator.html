{% if active %}
{% set running = active|selectattr('status', 'equalto', 'running')|list %}
<a href="/scans/{{ (running[0] if running else active[0]).id }}" class="hidden items-center gap-2 rounded-md bg-accent-50 px-3 py-1 font-mono text-xs font-semibold text-accent-700 ring-1 ring-inset ring-accent-200 hover:bg-accent-100 dark:bg-accent-500/10 dark:text-accent-300 dark:ring-accent-500/30 sm:inline-flex" title="Идёт сканирование">
  <span class="relative flex h-2 w-2"><span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-accent-400 opacity-75"></span><span class="relative inline-flex h-2 w-2 rounded-full bg-accent-500"></span></span>
  {% if running %}Скан #{{ running[0].id }}: {{ running[0].progress|round|int }}%{% else %}В очереди: {{ active|length }}{% endif %}
  {% if active|length > 1 %}<span class="muted">+{{ active|length - 1 }}</span>{% endif %}
</a>
{% endif %}
